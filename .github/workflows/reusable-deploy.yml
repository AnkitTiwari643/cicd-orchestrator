name: reusable-deploy

# Single parameterized deploy. The caller sets `environment:` (qa / stg /
# prod) so approvals stay on the orchestrator graph; this file only deploys.
on:
  workflow_call:
    inputs:
      target:
        description: Deployment target label (QA, STG, PROD)
        required: true
        type: string

jobs:
  deploying:
    name: ${{ inputs.target }} Deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Deploying ${{ github.sha }} (v$(cat VERSION)) to ${{ inputs.target }}"
