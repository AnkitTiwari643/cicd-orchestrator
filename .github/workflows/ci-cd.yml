name: ci-cd

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, integration]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Orchestrator: single place that decides which jobs run on what condition ──
  orchestrate:
    name: Orchestrator / Selecting workflow
    runs-on: ubuntu-latest
    outputs:
      is_pr: ${{ steps.route.outputs.is_pr }}
      is_push_integration: ${{ steps.route.outputs.is_push_integration }}
      is_push_main: ${{ steps.route.outputs.is_push_main }}
      run_ci: ${{ steps.route.outputs.run_ci }}
      deploy_qa: ${{ steps.route.outputs.deploy_qa }}
      deploy_stg: ${{ steps.route.outputs.deploy_stg }}
      deploy_prod: ${{ steps.route.outputs.deploy_prod }}
      do_version: ${{ steps.route.outputs.do_version }}
      do_sync: ${{ steps.route.outputs.do_sync }}
    steps:
      - id: route
        run: |
          EVENT="${{ github.event_name }}"
          REF="${{ github.ref }}"
          IS_PR=false; PUSH_INT=false; PUSH_MAIN=false
          if [ "$EVENT" = "pull_request" ]; then IS_PR=true; fi
          if [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/integration" ]; then PUSH_INT=true; fi
          if [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]; then PUSH_MAIN=true; fi

          RUN_CI=false; QA=false; STG=false; PROD=false; VER=false; SYNC=false
          if [ "$IS_PR" = true ]; then RUN_CI=true; fi
          if [ "$PUSH_INT" = true ]; then RUN_CI=true; QA=true; STG=true; fi
          if [ "$PUSH_MAIN" = true ]; then RUN_CI=true; QA=true; STG=true; PROD=true; VER=true; SYNC=true; fi

          {
            echo "is_pr=$IS_PR"
            echo "is_push_integration=$PUSH_INT"
            echo "is_push_main=$PUSH_MAIN"
            echo "run_ci=$RUN_CI"
            echo "deploy_qa=$QA"
            echo "deploy_stg=$STG"
            echo "deploy_prod=$PROD"
            echo "do_version=$VER"
            echo "do_sync=$SYNC"
          } >> "$GITHUB_OUTPUT"
          echo "event=$EVENT ref=$REF -> ci=$RUN_CI qa=$QA stg=$STG prod=$PROD version=$VER sync=$SYNC"

  # ── PR + push: tests (matrix like the screenshot) ──
  run-tests:
    name: Run Test / Testing
    needs: orchestrate
    if: needs.orchestrate.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --prefix app
      - run: npm --prefix app test

  coverage:
    name: Run Test / Coverage Report
    needs: [orchestrate, run-tests]
    if: needs.orchestrate.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix app
      - run: npm --prefix app test -- --experimental-test-coverage 2>&1 | tee coverage.txt || npm --prefix app test
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.txt

  # ── PR + push: build validation ──
  validate-build:
    name: Validate Build / Building
    needs: [orchestrate, run-tests]
    if: needs.orchestrate.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t app:${{ github.sha }} ./app

  # ── PR only: branch policy + PR hygiene ──
  validate-pr:
    name: Validate PR / Validating
    needs: orchestrate
    if: needs.orchestrate.outputs.is_pr == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce merge policy
        run: |
          BASE="${{ github.base_ref }}"
          HEAD="${{ github.head_ref }}"
          echo "PR: $HEAD -> $BASE"
          if [ "$BASE" = "integration" ]; then
            echo "$HEAD" | grep -Eq '^(feature|bugfix|hotfix)/.+$' \
              || { echo "❌ Into integration only: feature/*, bugfix/*, hotfix/* (got: $HEAD)"; exit 1; }
          elif [ "$BASE" = "main" ]; then
            if [ "$HEAD" = "integration" ]; then echo "✅ integration -> main allowed";
            else echo "$HEAD" | grep -Eq '^hotfix/.+$' \
              || { echo "❌ Into main only: integration or hotfix/* (got: $HEAD)"; exit 1; }; fi
          else
            echo "❌ PRs only to integration or main (got base: $BASE)"; exit 1
          fi
          echo "✅ branch policy passed"
      - name: Require Risk + Rollback in PR body
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "$BODY" | grep -qi "risk" || { echo "❌ PR body must have a Risk section"; exit 1; }
          echo "$BODY" | grep -qi "rollback" || { echo "❌ PR body must have a Rollback section"; exit 1; }
          echo "✅ PR hygiene passed"

  # ── Push main only: version bump (makes main exactly +1 ahead) ──
  version-up:
    name: Version Up / Updating Version
    needs: [orchestrate, validate-build]
    if: needs.orchestrate.outputs.do_version == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: bash scripts/bump-version.sh
      - run: git push origin main && git push origin --tags

  # ── Push integration/main: publish artifacts ──
  publish-artifacts:
    name: Publish Artifacts
    needs: [orchestrate, validate-build]
    if: needs.orchestrate.outputs.deploy_qa == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p dist
          echo "${{ github.sha }}" > dist/SHA
          cat VERSION > dist/VERSION
          echo "${{ github.ref_name }}" > dist/BRANCH
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: dist/

  # ── Push integration → QA + STG · Push main → QA + STG (+ PROD below) ──
  deploy-qa:
    name: QA Deployment
    needs: [orchestrate, publish-artifacts]
    if: needs.orchestrate.outputs.deploy_qa == 'true'
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - run: echo "Deploying ${{ github.sha }} (v$(cat VERSION 2>/dev/null || echo dev)) to QA"

  deploy-stg:
    name: STG Deployment
    needs: [orchestrate, publish-artifacts]
    if: needs.orchestrate.outputs.deploy_stg == 'true'
    runs-on: ubuntu-latest
    environment: stg
    steps:
      - run: echo "Deploying ${{ github.sha }} to STG"

  # ── Push main only: PROD behind approval gate ──
  deploy-prod:
    name: PROD Deployment / Approval
    needs: [orchestrate, publish-artifacts]
    if: needs.orchestrate.outputs.deploy_prod == 'true'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - run: echo "Deploying ${{ github.sha }} to PROD (approved)"

  # ── Push main only: sync integration with main (after version commit) ──
  sync-integration:
    name: Sync Integration / Updating
    needs: [orchestrate, version-up]
    if: needs.orchestrate.outputs.do_sync == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main integration
          git checkout integration
          git merge --no-ff origin/main -m "chore(sync): merge main into integration after release" \
            || { echo "Merge conflict — opening PR instead";
                 # Fallback if integration protection blocks direct push:
                 # gh pr create --base integration --head main --title "chore(sync): main -> integration" --body "Auto-sync after release"
                 exit 1; }
          git push origin integration

  # ── Post-deploy smoke ──
  post-deploy:
    name: Post Deployment / Smoke
    needs: [orchestrate, deploy-qa, deploy-stg]
    if: needs.orchestrate.outputs.deploy_qa == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          npm install --prefix app
          PORT=3999 APP_VERSION=$(cat VERSION) node app/index.js &
          PORT=3999 APP_VERSION=$(cat VERSION) node app/index.js &
          sleep 3
          curl -fsS http://localhost:3999/health | grep -q ok && echo "✅ smoke passed"
